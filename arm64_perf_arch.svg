<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <style>
      .title  { font-size: 26px; font-weight: 700; fill: #1a1a1a; }
      .sub    { font-size: 13px; fill: #666; }
      .layer  { font-size: 18px; font-weight: 700; }
      .item   { font-size: 13px; fill: #222; }
      .path   { font-size: 12px; fill: #555; font-style: italic; }
      .tag    { font-size: 12px; font-weight: 700; }
      .flowL  { font-size: 12.5px; fill: #c62828; font-weight: 600; }
      .flowR  { font-size: 12.5px; fill: #1565c0; font-weight: 600; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1180" height="980" fill="#fafafa"/>

  <!-- header -->
  <text x="40" y="48" class="title">arm64 perf 子系统架构 (Linux v6.6)</text>
  <text x="40" y="72" class="sub">从用户态命令到 PMU 硬件的分层结构与采样数据流</text>

  <!-- ===================== Layer boxes ===================== -->

  <!-- Userspace -->
  <rect x="40" y="95" width="900" height="78" rx="10" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <text x="60" y="122" class="layer" fill="#5e35b1">用户态 USERSPACE</text>
  <text x="60" y="148" class="item">perf record / stat / top / report &#160;&#160;·&#160;&#160; perf mem · perf c2c (基于 SPE)</text>
  <text x="60" y="166" class="path">tools/perf/builtin-*.c &#160;+&#160; tools/perf/util/</text>

  <!-- syscall divider -->
  <line x1="40" y1="195" x2="940" y2="195" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="490" y="190" class="sub">— perf_event_open(2) 系统调用 ↓ &#160;&#160;/&#160;&#160; mmap 读 ring buffer ↑ —</text>

  <!-- (1) generic perf core -->
  <rect x="40" y="205" width="900" height="120" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="60" y="232" class="layer" fill="#1565c0">① 通用 PERF CORE（架构无关）</text>
  <text x="822" y="232" class="path">kernel/events/</text>
  <text x="60" y="258" class="item">• SYSCALL_DEFINE5(perf_event_open) — 建 perf_event / context、调度、group 管理</text>
  <text x="60" y="278" class="item">• perf_event_overflow() — 采样总入口 &#160;&#160;|&#160;&#160; perf_callchain() — 抓调用栈</text>
  <text x="60" y="298" class="item">• ring_buffer.c — 采样记录写入环形缓冲（用户态 mmap 那块）</text>
  <text x="60" y="316" class="path">对下只认抽象接口 struct pmu (.add/.del/.start/.stop/.read)</text>

  <!-- (2) ARM PMU framework -->
  <rect x="40" y="350" width="900" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="377" class="layer" fill="#2e7d32">② ARM PMU 框架（所有 ARM 共用）</text>
  <text x="800" y="377" class="path">drivers/perf/arm_pmu.c</text>
  <text x="60" y="403" class="item">• 桥接 struct pmu ↔ struct arm_pmu(一组函数指针,由下层填充)</text>
  <text x="60" y="423" class="item">• armpmu_event_init / set_period / dispatch_irq / enable</text>
  <text x="60" y="443" class="item">• 探测接线: arm_pmu_platform.c (设备树 DT) · arm_pmu_acpi.c (ACPI/服务器)</text>

  <!-- (3) PMUv3 driver -->
  <rect x="40" y="485" width="900" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="60" y="512" class="layer" fill="#e65100">③ PMUv3 驱动（arm64 CPU 实体驱动）</text>
  <text x="790" y="512" class="path">drivers/perf/arm_pmuv3.c</text>
  <text x="60" y="538" class="item">• armv8pmu_init(): 填充 struct arm_pmu 回调</text>
  <text x="60" y="558" class="item">• armv8pmu_handle_irq ◄ 溢出中断/采样发生点 &#160;|&#160; enable_event · get_event_idx</text>
  <text x="60" y="578" class="item">• set_event_filter (EL0/EL1) · map_event → armv8_pmuv3_perf_map(事件表)</text>

  <!-- (4) arch glue -->
  <rect x="40" y="620" width="900" height="98" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="60" y="647" class="layer" fill="#ad1457">④ arm64 寄存器胶水层（唯一碰硬件的地方）</text>
  <text x="710" y="647" class="path">arch/arm64/include/asm/arm_pmuv3.h</text>
  <text x="60" y="673" class="item">read/write_sysreg 封装: pmcr_el0(总开关) · pmevcntr&lt;n&gt;(计数值) · pmevtyper&lt;n&gt;(选事件)</text>
  <text x="60" y="693" class="item">pmccntr_el0(周期) · pmovsclr_el0(溢出位图) · pmintenset_el1(中断使能)</text>
  <text x="60" y="711" class="path">+ arch/arm64/kernel/perf_callchain.c(爬栈) · perf_regs.c(采样寄存器)</text>

  <!-- (5) hardware -->
  <rect x="40" y="743" width="900" height="92" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="60" y="770" class="layer" fill="#37474f">⑤ 硬件 HARDWARE</text>
  <text x="60" y="796" class="item">ARMv8/v9 PMUv3:N 个通用事件计数器(典型 6) + 1 个专用周期计数器</text>
  <text x="60" y="816" class="item">计数溢出 → 触发 PPI 中断(一根中断管所有计数器)</text>

  <!-- vertical connectors between layers (center) -->
  <line x1="490" y1="173" x2="490" y2="204" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="325" x2="490" y2="349" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="460" x2="490" y2="484" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="595" x2="490" y2="619" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="718" x2="490" y2="742" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===================== Side flow panels ===================== -->

  <!-- config path (down) LEFT label rail -->
  <rect x="965" y="205" width="180" height="300" rx="10" fill="#fff" stroke="#c62828" stroke-width="1.6"/>
  <text x="975" y="230" class="flowL">▼ 配置路径(向下)</text>
  <text x="975" y="252" class="item" font-size="11.5">perf_event_open</text>
  <text x="975" y="272" class="item" font-size="11.5">↓ armpmu_event_init</text>
  <text x="975" y="292" class="item" font-size="11.5">↓ map_event 查事件表</text>
  <text x="975" y="312" class="item" font-size="11.5">↓ get_event_idx</text>
  <text x="975" y="332" class="item" font-size="11.5">&#160;&#160;分配计数器槽位</text>
  <text x="975" y="356" class="item" font-size="11.5">↓ 写 pmevtyper&lt;n&gt;</text>
  <text x="975" y="376" class="item" font-size="11.5">&#160;&#160;选要统计的事件</text>
  <text x="975" y="396" class="item" font-size="11.5">↓ 写 pmevcntr&lt;n&gt;</text>
  <text x="975" y="416" class="item" font-size="11.5">&#160;&#160;装采样周期初值</text>
  <text x="975" y="436" class="item" font-size="11.5">↓ 使能计数 (pmcr)</text>
  <text x="975" y="466" class="flowL">= 一个 event 诞生</text>
  <text x="975" y="486" class="item" font-size="11.5" fill="#999">并挂到某个计数器上</text>

  <!-- sampling path (up) -->
  <rect x="965" y="525" width="180" height="310" rx="10" fill="#fff" stroke="#1565c0" stroke-width="1.6"/>
  <text x="975" y="550" class="flowR">▲ 采样路径(向上)</text>
  <text x="975" y="572" class="item" font-size="11.5">计数器溢出</text>
  <text x="975" y="592" class="item" font-size="11.5">→ PPI 中断</text>
  <text x="975" y="612" class="item" font-size="11.5">→ armpmu_dispatch_irq</text>
  <text x="975" y="632" class="item" font-size="11.5">→ armv8pmu_handle_irq</text>
  <text x="975" y="652" class="item" font-size="11.5">&#160;&#160;读 pmovsclr 找溢出位</text>
  <text x="975" y="672" class="item" font-size="11.5">&#160;&#160;event_update 累加</text>
  <text x="975" y="692" class="item" font-size="11.5">&#160;&#160;重装采样周期</text>
  <text x="975" y="712" class="item" font-size="11.5">→ perf_event_overflow</text>
  <text x="975" y="732" class="item" font-size="11.5">&#160;&#160;(+perf_callchain 抓栈)</text>
  <text x="975" y="752" class="item" font-size="11.5">→ ring_buffer</text>
  <text x="975" y="772" class="item" font-size="11.5">→ mmap → perf.data</text>
  <text x="975" y="800" class="flowR" font-size="11.5">⚠ 此处取 PC 有 skid</text>
  <text x="975" y="818" class="item" font-size="11" fill="#999">精确归因改用 SPE</text>

  <!-- big flow arrows on far sides -->
  <line x1="1055" y1="500" x2="1055" y2="208" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="1055" y1="528" x2="1055" y2="828" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowUp)" opacity="0.5" transform="rotate(180 1055 678)"/>

  <!-- side note: parallel drivers -->
  <rect x="40" y="858" width="1105" height="92" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="1.6"/>
  <text x="60" y="882" class="layer" font-size="15" fill="#f57f17">旁路:非标准 / 系统级 PMU(平行挂在框架 ②/① 上,不走 CPU PMUv3)</text>
  <text x="60" y="906" class="item">• SPE 统计采样(精确 PC + 数据地址 + 延迟,治 skid): drivers/perf/arm_spe_pmu.c &#160;&#160; ← perf mem / perf c2c 的底座</text>
  <text x="60" y="926" class="item">• Apple M1: apple_m1_cpu_pmu.c &#160;&#160; • 互联/网格 uncore: arm-cmn.c · arm-cci.c · arm_dsu_pmu.c &#160;&#160; • 32位ARM旧布局: arch/arm/kernel/perf_event_v7.c</text>
  <text x="60" y="944" class="path">注:BRBE(分支记录,≈LBR)在 v6.6 仅有寄存器定义,尚无 perf 驱动支持</text>
</svg>
